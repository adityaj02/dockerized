name: CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  docker-build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Secrets Presence
        run: |
          if [ -z "${{ secrets.DOCKERHUB_USERNAME }}" ]; then echo "❌ DOCKERHUB_USERNAME is missing"; else echo "✅ DOCKERHUB_USERNAME is present"; fi
          if [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then echo "❌ DOCKERHUB_TOKEN is missing"; else echo "✅ DOCKERHUB_TOKEN is present"; fi

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build frontend image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/frontend-app:latest ./client

      - name: Build backend image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/backend-app:latest ./server

      - name: Push frontend image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/frontend-app:latest

      - name: Push backend image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/backend-app:latest
